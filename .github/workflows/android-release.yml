name: Android Release Build

on:
    push:
        branches:
            - 'release/**'

jobs:
    build-release:
        name: Build Release AAB
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@v4

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Create keystore directory
                run: mkdir -p app/keystore

            -   name: Decode Release Keystore
                env:
                    RELEASE_STORE_BASE_64: ${{ secrets.RELEASE_STORE_BASE_64 }}
                run: |
                    printf "%s" "$RELEASE_STORE_BASE_64" | base64 --decode > app/keystore/release.jks

            -   name: Create Gradle Properties
                env:
                    STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
                    KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
                run: |
                    cat > gradle.properties << 'EOF'
                    RELEASE_STORE_FILE=${{ github.workspace }}/app/keystore/release.jks
                    EOF
                    echo "RELEASE_STORE_PASSWORD=${STORE_PASSWORD}" >> gradle.properties
                    echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> gradle.properties
                    echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> gradle.properties

            -   name: Build Release AAB
                run: ./gradlew bundleRelease

            -   name: Upload Release AAB
                uses: actions/upload-artifact@v4
                with:
                    name: release-aab
                    path: app/build/outputs/bundle/release/*.aab

            -   name: Upload mapping.txt (ProGuard)
                uses: actions/upload-artifact@v4
                with:
                    name: mapping
                    path: app/build/outputs/mapping/release/mapping.txt
