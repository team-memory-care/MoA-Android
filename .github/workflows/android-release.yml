name: Android Release Build

on:
    push:
        branches:
            - 'release/**'

jobs:
    build-release:
        name: Build Release AAB
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@v4

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Decode Release Keystore
                env:
                    RELEASE_STORE_BASE_64: ${{ secrets.RELEASE_STORE_BASE_64 }}
                run: |
                    mkdir -p app/keystore
                    printf "%s" "$RELEASE_STORE_BASE_64" | base64 --decode > app/keystore/release.jks

            -   name: Build Release AAB
                env:
                    RELEASE_STORE_FILE: ${{ github.workspace }}/app/keystore/release.jks
                    RELEASE_STORE_PASSWORD_BASE64: ${{ secrets.RELEASE_STORE_PASSWORD_BASE64 }}
                    RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
                    RELEASE_KEY_PASSWORD_BASE64: ${{ secrets.RELEASE_KEY_PASSWORD_BASE64 }}
                run: ./gradlew bundleRelease --parallel --build-cache

            -   name: Upload Release AAB
                uses: actions/upload-artifact@v4
                with:
                    name: release-aab
                    path: app/build/outputs/bundle/release/*.aab

            -   name: Upload mapping.txt (ProGuard)
                uses: actions/upload-artifact@v4
                with:
                    name: mapping
                    path: app/build/outputs/mapping/release/mapping.txt
